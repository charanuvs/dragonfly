# Replace <hub-tailscale-ip> with this hub's tailnet address before deployment.
server:
    interface: <hub-tailscale-ip>
    access-control: 100.64.0.0/10 allow
    do-ip4: yes
    do-ip6: no
    hide-identity: yes
    hide-version: yes
    local-zone: "phila.int." static
    local-data: "phila.int. 60 IN A <hub-tailscale-ip>"
    local-data: "video.phila.int. 60 IN A <hub-tailscale-ip>"