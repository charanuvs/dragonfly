[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfly"
version = "0.1.0"
description = "Home automation, security, and monitoring hub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "starlette>=0.39",
    "uvicorn[standard]>=0.30",
    "paho-mqtt>=2.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "python-kasa>=0.12.0",
    "reolink-aio>=0.23.0",
]

[project.optional-dependencies]
# Required for camera capture and frame processing on the hub host.
camera = [
    "opencv-python-headless>=4.9",
]
raspberry-pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2.0; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
dragonfly-capture = "dragonfly.hub.capture_main:run"
dragonfly-portal = "dragonfly.hub.portal_main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
