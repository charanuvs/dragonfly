[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfly"
version = "0.1.0"
description = "Home automation, security, and monitoring hub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "paho-mqtt>=2.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed only on the Pi; opencv/picamera2 don't need to be on the Mac.
camera = [
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
dragonfly-hub = "dragonfly.hub.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
