# Copy this to /etc/dragonfly/dragonfly.yaml on the hub host (or config/dragonfly.yaml
# for local dev) and adjust for your setup.
# /etc/dragonfly/dragonfly.yaml is per-host configuration — never commit production credentials.

mqtt:
  host: localhost
  port: 1883

storage:
  recordings_path: /mnt/dragonfly-hdd/recordings
  database_path: /mnt/dragonfly-hdd/dragonfly.db
  # The recorder checks this is actually mounted before every write — see
  # docs/recording.md. Set to null if you're not using a separate mount
  # (e.g. recording straight to internal storage) to skip the check.
  mount_point: /mnt/dragonfly-hdd

dashboard:
  bind_host: 0.0.0.0   # fine to leave as-is; the hub's IoT-network interface
                        # never gets a route to the dashboard anyway (see docs/network.md)
  port: 8000

# Health monitoring, run by the portal process (not capture — a component
# can't report its own death). Checks camera reachability, storage health,
# whether recordings are actually landing on disk, and whether the capture
# process is up. See docs/architecture.md.
watchdog:
  interval_s: 15
  capture_service: dragonfly-capture
  storage_full_pct: 95        # storage counts as unhealthy at/above this
  recording_grace_s: 60       # slack past a segment's length before
                              # recording is judged stopped
  # Auto-repair a dead/missing mount (clears a zombie mount, re-runs
  # mount -a). Runs via sudo against a root-owned script installed by
  # the installer. Set false to handle mounts yourself.
  repair_storage: true
  repair_command: /usr/local/sbin/dragonfly-mount-repair
  repair_min_interval_s: 60

# Cameras: define your cameras here. Kept empty by default so fresh installs
# start up cleanly without attempting to connect to placeholder streams.
cameras: []

