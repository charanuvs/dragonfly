# Copy this to config/dragonfly.yaml on the Pi and adjust for your setup.
# config/dragonfly.yaml is gitignored — never commit the real one.

mqtt:
  host: localhost
  port: 1883

storage:
  recordings_path: /mnt/dragonfly-hdd/recordings
  database_path: /mnt/dragonfly-hdd/dragonfly.db

dashboard:
  bind_host: 0.0.0.0   # fine to leave as-is; the Pi's IoT-network interface
                        # never gets a route to the dashboard anyway (see docs/network.md)
  port: 8000

cameras:
  - id: OW
    name: "Outdoor West"
    # RTSP/ONVIF stream URL, credentials included — this file is gitignored,
    # never commit the real one.
    rtsp_url: "rtsp://<user>:<password>@<camera-ip>:554/stream1"
    poll_interval_s: 15
    timeout_s: 3
